[package]
name = "open-autoclicker"
version = "0.1.0"
description = "A modern cross-platform autoclicker"
authors = ["jasperdevs"]
license = "MIT"
repository = "https://github.com/jasperdevs/open-autoclicker"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
enigo = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["time", "sync"] }
